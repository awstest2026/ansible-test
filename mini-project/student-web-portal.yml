---

- hosts: all
  become: true
  pre_tasks:

  - name: install updates(AlmaLinux)
    tags: always
    dnf:
      update_only: yes
      update_cache: yes
    when: ansible_distribution == "AlmaLinux"

  - name: install updates(Ubuntui)
    tags: always
    apt:
      upgrade: dist
      update_cache: yes
    when: ansible_distribution == "Ubuntu"

- hosts: web_servers
  become: true
  tasks:  

  - name: install apache php package for ubuntu
    tags: apache,apache2,ubuntu
    apt:
      name: 
        - apache2
        - libapache2-mod-php
        - php-mysql
      state: latest
    when: ansible_distribution == "Ubuntu"

  - name: install apache and php for AlmaLinux server
    tags: apache,almalinux,httpd
    dnf:
      name:
        - httpd
        - php
        - php-mysqlnd  
      state: latest
    when: ansible_distribution == "AlmaLinux"

  - name: start Apache on AlmaLinux
    service:
      name: httpd
      state: started
      enabled: true
    when: ansible_distribution == "AlmaLinux"

  - name: Start Apache on Ubuntu
    service:
      name: apache2
      state: started
      enabled: true
    when: ansible_distribution == "Ubuntu"

  - name: remove apache default page
    file:
      path: /var/www/html/index.html
      state: absent   

  - name: Deploy student result website
    copy:
      src: app/index.php
      dest: /var/www/html/index.php
      owner: root
      group: root
      mode: '0644'
  

- hosts: db_servers
  become: true
  tasks:

  - name: install mariadb package (AlmaLinux)
    tags: almalinux,db,mariadb
    dnf:
      name: 
        - mariadb-server
        - python3-PyMySQL
      state: present
    when: ansible_distribution == "AlmaLinux"

  - name: installa mariadb package (Ubuntu)
    tags: db,mariadb,ubuntu
    apt:
      name: 
        - mariadb-server
        - python3-pymysql
      state: present
    when: ansible_distribution == "Ubuntu"

  - name: Start MariaDB on AlmaLinux
    service:
      name: mariadb 
      state: started
      enabled: true
    when: ansible_distribution == "AlmaLinux"
  
  - name: Start MariaDB on Ubuntu
    service:
      name: mariadb
      state: started   
      enabled: true
    when: ansible_distribution == "Ubuntu"

  - name: Configure Mariadb to Listen on all ports
    lineinfile:
      path: /etc/mysql/mariadb.conf.d/50-server.cnf
      regexp: '^\s*bind-address\s*='
      line: 'bind-address = 0.0.0.0'
      state: present
      backup: true
    when: ansible_distribution == "Ubuntu"
    notify: Restart MariaDB  

  - name: Create student_results database
    community.mysql.mysql_db:
      name: student_results
      state: present
      login_unix_socket: /run/mysqld/mysqld.sock
    when: ansible_distribution == "Ubuntu"

  - name: Create student_app database user
    community.mysql.mysql_user:
      name: student_app
      password: "StudentDB@123"
      host: "%"
      priv:
        "student_results.*": "ALL"
      state: present
      login_unix_socket: /run/mysqld/mysqld.sock
    when: ansible_distribution == "Ubuntu"


  - name: Create students table
    community.mysql.mysql_query:
      login_unix_socket: /run/mysqld/mysqld.sock
      login_db: student_results
      query: |
        CREATE TABLE IF NOT EXISTS students (
          id INT AUTO_INCREMENT PRIMARY KEY,
          student_id VARCHAR(20) NOT NULL UNIQUE,
          name VARCHAR(150) NOT NULL,
          tilawat DECIMAL(5,2) DEFAULT 0,
          kawaayed DECIMAL(5,2) DEFAULT 0,
          surah DECIMAL(5,2) DEFAULT 0,
          mashq DECIMAL(5,2) DEFAULT 0,
          attendance DECIMAL(5,2) DEFAULT 0,
          total DECIMAL(5,2) DEFAULT 0,
          created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
         );
    when: ansible_distribution == "Ubuntu"

  - name: Copy student SQL data to database server
    copy:
      src: database/students.sql
      dest: /tmp/students.sql
      owner: root
      group: root
      mode: '0600'
    when: ansible_distribution == "Ubuntu"

  - name: Import student data into MariaDB
    community.mysql.mysql_db:
      name: student_results
      state: import
      target: /tmp/students.sql
      login_unix_socket: /run/mysqld/mysqld.sock
    when: ansible_distribution == "Ubuntu"

  handlers:
    - name: Restart MariaDB
      service:
        name: mariadb
        state: restarted   

- hosts: file_servers
  become: true
  tasks:

  - name: install samba package
    tags: samba
    package:
      name: samba
      state: latest
